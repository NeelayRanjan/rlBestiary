[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
rapier3d = { version = "=0.23.1", features = ["enhanced-determinism", "serde-serialize"] }
nalgebra = { version = "=0.33.2", features = ["serde-serialize"] }
rand = "=0.8.5"
rand_chacha = { version = "=0.3.1", features = ["serde1"] }
serde = { version = "=1.0.219", features = ["derive"] }
postcard = { version = "=1.1.1", features = ["alloc", "use-std"] }
ron = "=0.8.1"
rusqlite = { version = "=0.33.0", features = ["bundled"] }
rayon = "=1.10.0"
proptest = "=1.6.0"
criterion = "=0.5.1"
libm = "=0.2.11"
blake3 = "=1.5.5"
base64 = "=0.22.1"
serde_json = "=1.0.140"
bevy = { version = "=0.15.3", default-features = false, features = ["bevy_winit", "bevy_pbr", "bevy_render", "bevy_core_pipeline", "bevy_asset", "bevy_color", "bevy_window", "bevy_gizmos", "bevy_picking", "multi_threaded", "png", "x11", "tonemapping_luts"] }
bevy_egui = { version = "=0.33.0", default-features = false, features = ["render", "default_fonts", "manage_clipboard"] }

interprocess = "=2.2.3"
fs2 = "=0.4.3"
ctrlc = "=3.4.5"

[profile.release]
codegen-units = 1
lto = "thin"

[profile.test]
opt-level = 2
